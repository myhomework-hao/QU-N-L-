<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán | VIBE Studio</title>

    <link rel="stylesheet" href="../assets/style.css">
    <link rel="stylesheet" href="../includes/header.css">
    <link rel="stylesheet" href="../includes/footer.css">
    <link rel="stylesheet" href="cart.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div data-include="../includes/header.html"></div>

    <section class="page-head" id="pageHead">
        <p class="page-label">CHECKOUT</p>
        <h1>THANH <i>TOÁN.</i></h1>
        <ol class="steps">
            <li class="done">1. GIỎ HÀNG</li>
            <li class="current">2. THANH TOÁN</li>
            <li>3. HOÀN TẤT</li>
        </ol>
    </section>

    <section class="shop-area" id="shopArea">
        <div class="checkout-layout" id="checkoutLayout">

            <form class="checkout-form stack" id="checkoutForm" novalidate>

                <div class="notice" id="emptyNotice" hidden>
                    <span>Giỏ hàng của bạn đang trống nên chưa thể đặt hàng.</span>
                    <a href="san-pham.html" class="btn-dark">XEM SẢN PHẨM</a>
                </div>

                <fieldset id="formFields" class="stack">

                    <div class="card">
                        <div class="card-head"><h2>Thông tin liên hệ</h2></div>
                        <div class="card-body">
                            <div class="field-grid">
                                <label class="field full">Họ tên
                                    <input type="text" name="name" autocomplete="name" required>
                                </label>
                                <label class="field">Số điện thoại
                                    <input type="tel" name="phone" autocomplete="tel" pattern="0[0-9]{9}" title="Nhập 10 số, bắt đầu bằng 0" required>
                                </label>
                                <label class="field">Email
                                    <input type="email" name="email" autocomplete="email" required>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-head"><h2 id="addressTitle">Địa chỉ nhận hàng</h2></div>
                        <div class="card-body">
                            <div class="field-grid">
                                <label class="field full" data-ship>Địa chỉ
                                    <input type="text" name="address" autocomplete="street-address" placeholder="Số nhà, tên đường">
                                </label>
                                <label class="field" data-ship>Phường / Xã
                                    <input type="text" name="ward">
                                </label>
                                <label class="field" data-ship>Quận / Huyện
                                    <input type="text" name="district">
                                </label>
                                <label class="field full" data-ship>Tỉnh / Thành phố
                                    <select name="city">
                                        <option value="Cần Thơ">Cần Thơ</option>
                                        <option value="TP. Hồ Chí Minh">TP. Hồ Chí Minh</option>
                                        <option value="Hà Nội">Hà Nội</option>
                                        <option value="Đà Nẵng">Đà Nẵng</option>
                                        <option value="Khác">Tỉnh / thành khác</option>
                                    </select>
                                </label>
                                <label class="field full">Ghi chú
                                    <textarea name="note" rows="3" placeholder="Ví dụ: ngày giờ muốn chụp, giao ngoài giờ hành chính…"></textarea>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-head"><h2>Phương thức thanh toán</h2></div>
                        <div class="card-body">

                            <label class="pay-option">
                                <input type="radio" name="payment" value="Thanh toán khi nhận hàng" checked>
                                <div>
                                    <strong>Thanh toán khi nhận hàng (COD)</strong>
                                    <span>Trả tiền mặt cho nhân viên giao hàng, hoặc trả tại studio khi đến chụp.</span>
                                </div>
                            </label>

                            <label class="pay-option">
                                <input type="radio" name="payment" value="Chuyển khoản ngân hàng">
                                <div>
                                    <strong>Chuyển khoản ngân hàng</strong>
                                    <span>Chuyển khoản trước, studio xác nhận đơn trong giờ làm việc.</span>
                                    <div class="bank-box">
                                        Ngân hàng: <b>Vietcombank</b><br>
                                        Số tài khoản: <b>0123 456 789</b><br>
                                        Chủ tài khoản: <b>VIBE STUDIO</b><br>
                                        Nội dung: <b>Mã đơn hàng + số điện thoại</b>
                                    </div>
                                </div>
                            </label>

                            <label class="pay-option">
                                <input type="radio" name="payment" value="Ví điện tử (MoMo / ZaloPay)">
                                <div>
                                    <strong>Ví điện tử (MoMo / ZaloPay)</strong>
                                    <span>Studio sẽ gửi mã QR qua Zalo hoặc email sau khi nhận đơn.</span>
                                </div>
                            </label>

                        </div>
                    </div>

                </fieldset>

                <div class="submit-row">
                    <button type="submit" class="btn-dark" id="submitBtn">ĐẶT HÀNG</button>
                    <p class="form-error" id="formError" role="alert"></p>
                </div>
            </form>

            <aside class="summary">
                <p class="panel-title">Đơn hàng của bạn</p>
                <div class="summary-items" id="sumItems"></div>
                <div class="summary-row"><span>Tạm tính</span><span id="sumSub">0₫</span></div>
                <div class="summary-row" id="sumDiscountRow" hidden><span id="sumDiscountLabel">Giảm giá</span><span id="sumDiscount">0₫</span></div>
                <div class="summary-row"><span>Vận chuyển</span><span id="sumShip">—</span></div>
                <div class="summary-row total"><span>Tổng cộng</span><span id="sumTotal">0₫</span></div>
                <p class="ship-note"><a href="gio-hang.html" style="border-bottom:1px solid #888">Chỉnh sửa giỏ hàng</a></p>
            </aside>

        </div>
    </section>

    <div data-include="../includes/footer.html"></div>
    
    <script src="../includes/link.js"></script>
    <script src="../includes/cart.js"></script>
    <script src="../includes/common.js"></script>
    <script>
        const $ = (id) => document.getElementById(id);
        const form = $("checkoutForm");
        const t0 = totals();
        const empty = t0.cart.length === 0;

        const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        // ----- Khung tóm tắt (luôn hiện) -----
        $("sumItems").innerHTML = empty
            ? `<p class="none">Chưa có sản phẩm nào.</p>`
            : t0.cart.map(i => {
                const p = findProduct(i.id);
                return `<div class="summary-row"><span>${esc(p.name)} × ${i.qty}</span><span>${fmt(p.price * i.qty)}</span></div>`;
            }).join("");
        $("sumSub").textContent = fmt(t0.subtotal);
        $("sumDiscountRow").hidden = !t0.discount;
        $("sumDiscountLabel").textContent = "Giảm giá (" + t0.code + ")";
        $("sumDiscount").textContent = "−" + fmt(t0.discount);
        $("sumShip").textContent = empty ? "—" : (!t0.needShip ? "Không cần" : (t0.shipping ? fmt(t0.shipping) : "Miễn phí"));
        $("sumTotal").textContent = fmt(t0.total);

        // ----- Giỏ trống: vẫn hiện khung, nhưng khóa form -----
        if (empty) {
            $("emptyNotice").hidden = false;
            $("formFields").disabled = true;
            $("submitBtn").disabled = true;
        } else if (t0.needShip) {
            ["address", "ward", "district"].forEach(n => form.elements[n].required = true);
        } else {
            // Chỉ có gói chụp / voucher thì không cần địa chỉ giao hàng
            $("addressTitle").textContent = "Ghi chú đơn hàng";
            document.querySelectorAll("[data-ship]").forEach(f => f.style.display = "none");
        }

        form.addEventListener("submit", e => {
            e.preventDefault();
            $("formError").textContent = "";
            if (empty) return;

            if (!form.checkValidity()) {
                $("formError").textContent = "Vui lòng điền đầy đủ và đúng định dạng các ô bắt buộc.";
                form.querySelector(":invalid").focus();
                return;
            }

            const data = Object.fromEntries(new FormData(form));
            const t = totals();
            const code = "VB" + Date.now().toString().slice(-7);

            // TODO: gửi đơn hàng về server (PHP + database) tại đây
            console.log("Đơn hàng:", { code, ...data, items: t.cart, total: t.total });

            clearCart();

            $("pageHead").innerHTML = `
                <p class="page-label">CHECKOUT</p>
                <h1>HOÀN <i>TẤT.</i></h1>
                <ol class="steps">
                    <li class="done">1. GIỎ HÀNG</li>
                    <li class="done">2. THANH TOÁN</li>
                    <li class="current">3. HOÀN TẤT</li>
                </ol>`;

            $("shopArea").innerHTML = `
                <div class="card success">
                    <h1>ĐẶT HÀNG<br><i>THÀNH CÔNG.</i></h1>
                    <p>Cảm ơn ${esc(data.name)}! VIBE Studio sẽ liên hệ qua số ${esc(data.phone)} để xác nhận đơn trong vòng 24 giờ.</p>
                    <div class="order-code">MÃ ĐƠN: ${code}</div>
                    <p>Phương thức thanh toán: ${esc(data.payment)}</p>
                    <br>
                    <a href="index.html" class="btn-dark">VỀ TRANG CHỦ</a>
                </div>`;
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
    </script>

</body>
</html>
